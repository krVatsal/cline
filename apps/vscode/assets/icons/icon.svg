<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="zGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="zGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Subtle grid lines for high-tech aesthetic -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Bar with Chamfered Tech Cut -->
  <path d="M28 32 H96 C98.5 32 100 34.8 98.4 36.8 L81 58 H46 C42.7 58 40 55.3 40 52 L36 36 C36 33.8 33.8 32 31.6 32 Z" fill="url(#zGrad1)" opacity="0.95"/>

  <!-- Diagonal Power Beam -->
  <polygon points="86,38 34,92 48,92 98,42 98,38" fill="#F8FAFC" filter="url(#glow)"/>

  <!-- Bottom Bar with Chamfered Tech Cut -->
  <path d="M100 96 H32 C29.5 96 28 93.2 29.6 91.2 L47 70 H82 C85.3 70 88 72.7 88 76 L92 92 C92 94.2 94.2 96 96.4 96 Z" fill="url(#zGrad2)" opacity="0.95"/>

  <!-- Core Pulse Accent -->
  <circle cx="64" cy="64" r="5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>
</svg>